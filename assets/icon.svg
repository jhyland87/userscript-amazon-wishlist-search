<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Two versions of the icon; the media query picks one by color scheme. -->
  <style>
    .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .light { display: none; }
      .dark { display: inline; }
    }
  </style>
  <!-- Light theme: dark lens, orange rim, arrow and handle. -->
  <g class="light">
    <circle cx="26" cy="26" r="21" fill="#232f3e" stroke="#ff9900" stroke-width="4"/>
    <path d="M13.5 26q12.5 10 25 0" fill="none" stroke="#ff9900" stroke-width="5" stroke-linecap="round"/>
    <path d="M33.5 23.5l5.5 2.3-2.1 5.5" fill="none" stroke="#ff9900" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="42" y1="42" x2="57" y2="57" stroke="#ff9900" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- Dark theme: the same icon with a white lens, so the rim and handle
       stay orange against dark backgrounds. -->
  <g class="dark">
    <circle cx="26" cy="26" r="21" fill="#fff" stroke="#ff9900" stroke-width="4"/>
    <path d="M13.5 26q12.5 10 25 0" fill="none" stroke="#ff9900" stroke-width="5" stroke-linecap="round"/>
    <path d="M33.5 23.5l5.5 2.3-2.1 5.5" fill="none" stroke="#ff9900" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="42" y1="42" x2="57" y2="57" stroke="#ff9900" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
