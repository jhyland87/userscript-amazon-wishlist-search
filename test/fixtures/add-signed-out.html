<!-- Trimmed Amazon sign-in interstitial: what the endpoints return instead of
     doing the work when the session has expired. -->
<div id="authportal-main-section">
  <form name="signIn" method="post" action="/ap/signin">
    <input type="hidden" name="appActionToken" value="mvsKB2FTaZj3D">
    <input type="hidden" name="appAction" value="SIGNIN_PWD_COLLECT">
    <label for="ap_email">Email or mobile phone number</label>
    <input type="email" name="email" id="ap_email" tabindex="1">
    <input id="continue" type="submit" class="a-button-input" value="Continue">
  </form>
</div>
